<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dublin Stammtisch-Team-Auslosung</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🐾</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="app">
  <header class="app-header">
    <h1>🐾 Dublin Stammtisch-Team-Auslosung 🐾</h1>
    <p class="subtitle">Wer Gassi geht mit wem, von Jan/Feb bis Nov/Dez</p>
  </header>

  <section id="setup" class="screen">
    <p class="hint">Trage genau 15 Namen ein, einen pro Zeile.</p>
    <textarea id="names-input" rows="15">Jannik
Jan
Christoph
Lütti
Marvin
Nico
Marius
Carsten
Robin
Phil
Julius
Tim
Lars
David
Steak</textarea>
    <p id="setup-error" class="error" role="alert"></p>
    <button id="draw-btn" class="btn-primary">Teams auslosen</button>
  </section>

  <section id="reveal" class="screen hidden">
    <p class="progress"></p>
    <div id="reveal-card" class="card"></div>
    <button id="next-btn" class="btn-primary">Weiter</button>
  </section>

  <section id="summary" class="screen hidden">
    <h2>Alle Teams</h2>
    <ol id="summary-list" class="summary-list"></ol>
    <button id="restart-btn" class="btn-secondary">Neu auslosen</button>
  </section>
</div>
<script src="app.js"></script>
</body>
</html>
